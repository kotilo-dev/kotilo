# cargo-about configuration for THIRD_PARTY_NOTICES (run through generate-notices.ps1).
# Shipped binaries: apps/desktop/src-tauri (agenthub) and crates/hook (agenthub-hook), for the
# two release targets. Dev-dependencies are not shipped and are ignored.

targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
# Our own workspace crates (agenthub, agenthub-hook, agenthub-proto) are not third-party.
private = { ignore = true }

# Permissive licenses we accept, in order of preference. For an OR expression cargo-about
# picks the first accepted option in this list (e.g. r-efi "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
# resolves to MIT; "Unlicense OR MIT" resolves to MIT).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "MPL-2.0",
]
