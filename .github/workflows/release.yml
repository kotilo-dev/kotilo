name: Release

# A `v*` tag builds the Windows installers (x64, ARM64), the Linux packages (AppImage, .deb, .rpm),
# the updater signatures and `latest.json`, and attaches them
# to a draft GitHub release. Publishing the draft is a manual step (and makes `latest.json` the
# feed behind brand.json `updateEndpoint`:
# https://github.com/kotilo-dev/kotilo/releases/latest/download/latest.json).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) from
# `tauri signer generate`; the matching public key goes into tauri.conf.json
# plugins.updater.pubkey. Without the key the installers are built but no `.sig`/`latest.json`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment).
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    # ARM64 is cross-built on x64 (MSVC ARM64 tools and LLVM/clang for `ring` are on the image).
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.arch }}
      - name: Put LLVM on PATH (ring needs clang for aarch64-pc-windows-msvc)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\LLVM\bin"
      - run: npm --prefix apps/desktop ci
      - name: Build installer
        shell: pwsh
        run: ./scripts/release.ps1 -Arch ${{ matrix.arch }}

      # Code signing (later): SignPath Foundation, D-047. The exe, the sidecars and their DLLs
      # must be signed before bundling and the installer before its updater `.sig` is made (a
      # signature changes the file the `.sig` covers), so the step splits the build:
      #   1. release.ps1 with a SignPath-backed sign command (bundle.windows.signCommand) or
      #   2. submit the unsigned installer, then re-create the `.sig` with
      #      `npx tauri signer sign <installer>` on the signed file.
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@<sha> # vX
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <id>
      #     project-slug: <project>
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: installer
      #     github-artifact-id: <id of an uploaded unsigned artifact>
      #     wait-for-completion: true
      #     output-artifact-directory: target/release-artifacts/${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: target/release-artifacts/${{ matrix.arch }}/
          if-no-files-found: error

  # Linux x64 packages (U-2, D-061). Built on the oldest supported Ubuntu so they run on older
  # glibc versions too.
  build-linux:
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x64
      - name: Linux system libraries (WebKitGTK, tray, audio, D-Bus, rpmbuild)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxdo-dev libssl-dev libasound2-dev libdbus-1-dev pkg-config \
            file rpm
      - run: npm --prefix apps/desktop ci
      - name: Build packages
        run: ./scripts/release-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-x64
          path: target/release-artifacts/linux-x64/
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
      - name: Generate latest.json
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          New-Item -ItemType Directory -Force upload | Out-Null
          # GitHub turns spaces in asset names into dots; name the files that way up front so
          # the URLs in latest.json match.
          Get-ChildItem dist -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path upload ($_.Name -replace ' ', '.'))
          }
          $platforms = [ordered]@{}
          # Keys as the updater looks them up: `<os>-<arch>-<package>` first, then `<os>-<arch>`
          # (an AppImage install asks for `linux-x86_64`).
          $targets = @(
            @{ key = 'windows-x86_64'; filter = "*_$($version)_x64-setup.exe" },
            @{ key = 'windows-aarch64'; filter = "*_$($version)_arm64-setup.exe" },
            @{ key = 'linux-x86_64'; filter = "*_$($version)_amd64.AppImage" },
            @{ key = 'linux-x86_64-deb'; filter = "*_$($version)_amd64.deb"},
            @{ key = 'linux-x86_64-rpm'; filter = "*-$($version)-*.x86_64.rpm"}
          )
          foreach ($p in $targets) {
            $installer = Get-ChildItem upload -File -Filter $p.filter | Select-Object -First 1
            if (-not $installer) { throw "installer for $($p.key) not found" }
            $sig = "$($installer.FullName).sig"
            if (-not (Test-Path $sig)) {
              Write-Warning "no updater signature for $($p.key) (TAURI_SIGNING_PRIVATE_KEY secret missing?); skipping latest.json"
              exit 0
            }
            $platforms[$p.key] = [ordered]@{
              signature = (Get-Content $sig -Raw).Trim()
              url       = "https://github.com/$env:REPO/releases/download/$env:TAG/$($installer.Name)"
            }
          }
          $latest = [ordered]@{
            version   = $version
            notes     = "See https://github.com/$env:REPO/releases/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = $platforms
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'upload/latest.json'), ($latest | ConvertTo-Json -Depth 5))
          Get-Content upload/latest.json
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem upload -File | ForEach-Object FullName
          gh release create $env:TAG --repo $env:REPO --draft --verify-tag --title $env:TAG --generate-notes @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
