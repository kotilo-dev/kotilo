[package]
name = "agenthub-docs"
version = "0.1.0"
edition = "2021"
description = "Docs check (0.7): finds docs that name missing paths or cover code changed since review"

[lib]
name = "agenthub_docs"
path = "src/lib.rs"

[[bin]]
name = "agenthub-docs"
path = "src/main.rs"

[dependencies]
# Brand constants (exe prefix, product name) for the CLI's messages.
agenthub-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `.kotilo/docs.toml` covers globs (`literal_separator`: `*` never crosses `/`).
globset = "0.4.20"
# Walks the folder (respecting .gitignore) when git is not available.
ignore = "0.4.33"
percent-encoding = "2.3.2"
# "Mark reviewed" edits docs.toml in place, keeping comments and formatting.
toml_edit = "0.25"

[build-dependencies]
serde_json = "1"
tauri-winres = "0.3"

[dev-dependencies]
tempfile = "3"
